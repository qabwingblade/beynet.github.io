<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BeyNet</title>

<style>
:root{
  --bg:#0b0b10;
  --fg:#eaeaf2;
}
html,body{height:100%}
body{
  margin:0;
  display:grid;
  place-items:center;
  background:#0b0b10;
  color:var(--fg);
  font-family:system-ui,Segoe UI,Roboto,Inter,Arial,sans-serif;
}

.card{
  padding:28px 22px;
  border-radius:20px;
  background:rgba(255,255,255,.04);
  box-shadow:0 20px 50px rgba(0,0,0,.4);
  text-align:center;
  max-width:520px;
  width:calc(100vw - 28px);
}

.poster{
  width:100%;
  max-width:500px;
  height:auto;
  display:block;
  margin:0 auto;
}

.bar{
  height:3px;
  width:160px;
  margin:18px auto 0;
  border-radius:2px;
  background:rgba(255,255,255,.14);
  overflow:hidden;
  position:relative;
}
.bar:before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);
  animation:sweep 1.8s ease-in-out infinite;
}
@keyframes sweep{
  0%{transform:translateX(-100%)}
  50%{transform:translateX(0)}
  100%{transform:translateX(100%)}
}

.footer{
  margin-top:16px;
  font-size:15px;
  opacity:.92;
}

/* socials */
.socials{
  margin-top:14px;
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:14px;
  font-size:15px;
}
.socials a{
  color:#cfd8ff;
  text-decoration:none;
  padding:6px 10px;
  border-radius:10px;
  background:rgba(255,255,255,.05);
}
.socials a:hover{ text-decoration:underline; }

/* signup links */
.signup{
  margin-top:14px;
  display:grid;
  gap:10px;
}
.signup a{
  color:#ffffff;
  text-decoration:none;
  font-weight:650;
}
.signup a:hover{ text-decoration:underline; }

/* ------------------------- */
/* Slideshow                 */
/* ------------------------- */

.slideshow{
    position:relative;
    width:100%;
    max-width:500px;
    margin:0 auto;
}

.slideshow img{
    width:100%;
    border-radius:12px;
    display:block;
    transition:opacity .4s ease-in-out;
}

.slide-dots{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-top:12px;
}

.dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:rgba(255,255,255,.35);
    transition:.3s;
}

.dot.active{
    background:white;
}
</style>
</head>

<body>
<main class="card" role="main" aria-label="BeyNet">
  <!-- Slideshow -->
<div class="slideshow">

  <a id="slide-link" target="_blank" rel="noopener">
    <img id="slide-image" class="poster"
         src="WS BeyNet Logo.png"
         alt="Featured Image">
  </a>

  <div class="slide-dots">
    <span class="dot active"></span>
    <span class="dot"></span>
    <span class="dot"></span>
  </div>

</div>

  <!--div class="bar" aria-hidden="true"></div-->

  <div class="footer">This is BeyNet.</div>

  <!-- Social links -->
  <div class="socials" aria-label="BeyNet social links">
    <a href="https://www.youtube.com/@ThisisBeyNet" target="_blank" rel="noopener">▶ YouTube</a>
    <a href="https://www.instagram.com/ThisisBeyNet" target="_blank" rel="noopener">◎ Instagram</a>
    <a href="https://www.tiktok.com/@thisisbeynet" target="_blank" rel="noopener">♪ TikTok</a>
    <a href="https://discord.gg/Ej5ShXNfjx" target="_blank" rel="noopener">💬 Discord</a>
  </div>

  <!-- Signup -->
  <div class="signup">
    <a href="https://docs.google.com/forms/d/e/1FAIpQLSfrSuDNpvZ_ajJ-t525wJVLFjjd_l2eulG8-zl7IIY-k42gKQ/viewform?usp=dialog"
       target="_blank" rel="noopener">
      Sign Up To Join The BeyNet Team Here
    </a>

  </div>
</main>
<script>

const slides = [
    {
        image: "WS BeyNet Logo.png",
        link: "https://www.youtube.com/@ThisisBeyNet"
    },
    {
        image: "Bladers Ready.png",
        link: "https://www.etsy.com/shop/MonkiMatt?section_id=59428644"
    },
    {
        image: "WS RTC.png",
        link: "https://beynet-store.myshopify.com/"
    }
];

let currentSlide = 0;

const slideImage = document.getElementById("slide-image");
const slideLink = document.getElementById("slide-link");
const dots = document.querySelectorAll(".dot");

function showSlide(index){

    slideImage.style.opacity = 0;

    setTimeout(() => {

        slideImage.src = slides[index].image;
        slideLink.href = slides[index].link;

        dots.forEach(dot => dot.classList.remove("active"));
        dots[index].classList.add("active");

        slideImage.style.opacity = 1;

    },200);

}

function nextSlide(){

    currentSlide++;

    if(currentSlide >= slides.length){
        currentSlide = 0;
    }

    showSlide(currentSlide);

}

// Automatically change every 7 seconds
setInterval(nextSlide, 7000);

// Allow clicking the dots to change slides
dots.forEach((dot,index)=>{
    dot.addEventListener("click",()=>{
        currentSlide = index;
        showSlide(currentSlide);
    });
});

</script>
</body>
</html>
